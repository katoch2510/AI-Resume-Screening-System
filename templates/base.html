<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screener | HR Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom p-4">
                <h4 class="mb-0"><i class="fas fa-robot me-2"></i>AI Screener</h4>
            </div>
            <div class="list-group list-group-flush p-3">
                <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-2 {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="{{ url_for('jobs') }}" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-2 {% if request.endpoint == 'jobs' %}active{% endif %}">
                    <i class="fas fa-briefcase me-2"></i>Job Openings
                </a>
                <a href="{{ url_for('resumes') }}" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mb-2 {% if request.endpoint == 'resumes' %}active{% endif %}">
                    <i class="fas fa-file-invoice me-2"></i>Resumes
                </a>
                <a href="{{ url_for('logout') }}" class="list-group-item list-group-item-action bg-dark text-white border-0 rounded mt-5">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 px-4">
                <div class="container-fluid">
                    <button class="btn btn-outline-dark border-0" id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="me-3 text-muted"><i class="fas fa-user-circle me-1"></i> {{ current_user.username }}</span>
                        <div class="form-check form-switch ms-3">
                            <input class="form-check-input" type="checkbox" id="darkModeToggle">
                            <label class="form-check-label" for="darkModeToggle"><i class="fas fa-moon"></i></label>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-4">
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-info alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.getElementById("menu-toggle").addEventListener("click", function() {
            document.getElementById("wrapper").classList.toggle("toggled");
        });
    </script>
</body>
</html>
